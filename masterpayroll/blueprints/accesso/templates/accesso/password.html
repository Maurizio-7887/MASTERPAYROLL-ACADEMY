{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block content %}
<div class="card p-4" style="max-width:420px">
  <h1 class="h5 page-title">Cambia password</h1>
  <form method="post">{{ csrf() }}
    <div class="mb-2"><label class="form-label">Password attuale</label><input type="password" name="old" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Nuova password (min. 6 caratteri)</label><input type="password" name="new" class="form-control" minlength="6" required></div>
    <button class="btn btn-primary">Salva</button>
  </form>
</div>
{% endblock %}
