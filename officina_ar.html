<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-marker preset="hiro">
        <a-entity id="robot-industriale" 
                  gltf-model="url(https://raw.githack.com/KhronosGroup/glTF-Sample-Models/master/2.0/MaterialsVariantsShoe/glTF/MaterialsVariantsShoe.gltf)" 
                  scale="2 2 2" 
                  position="0 0 0"
                  animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
        </a-entity>

        <a-box id="lamiera" position="0 0.5 0.2" scale="0.8 0.01 0.4" color="silver">
            <a-animation attribute="rotation" from="0 0 0" to="30 0 0" dur="2000" repeat="indefinite"></a-animation>
        </a-box>

        <a-entity position="0 1.2 0">
            <a-plane color="#000" height="0.4" width="1.2" opacity="0.8"></a-plane>
            <a-text id="monitor-sforzo" value="STATO: PIEGATURA IN CORSO\nSFORZO: 102.4 Nm" 
                    align="center" color="#00FF00" scale="0.4 0.4 0.4" position="0 0 0.01"></a-text>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
