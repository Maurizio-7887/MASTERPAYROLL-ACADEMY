<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <title>Gemello Digitale AR - Master CRM</title>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>
      <a-marker preset="hiro">
        
        <a-box position="0 0.1 0" scale="1 0.2 0.4" color="#222"></a-box>
        
        <a-entity id="robot" position="0 0 0">
            <a-cylinder position="0 0.4 0" radius="0.05" height="0.8" color="orange">
                <a-sphere position="0 0.4 0" radius="0.06" color="blue"></a-sphere>
            </a-cylinder>
        </a-entity>

        <a-text id="telemetria" value="Sforzo: 0 Nm" position="-0.5 1 0" color="red" scale="0.5 0.5 0.5"></a-text>

      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Qui caricheremmo i dati dal file dati_per_ar.json generato in Colab
      // Per ora simuliamo l'animazione basata su quei calcoli
      let robot = document.querySelector("#robot");
      let testo = document.querySelector("#telemetria");
      let t = 0;

      setInterval(() => {
        t += 0.05;
        let angolo = Math.sin(t) * 45; // Simula la piegatura
        let sforzo = Math.abs(Math.sin(t) * 110).toFixed(2);
        
        robot.setAttribute('rotation', `0 0 ${angolo}`);
        testo.setAttribute('value', `Sforzo: ${sforzo} Nm`);
        
        // Colore dinamico: se lo sforzo è alto, il testo diventa rosso acceso
        if(sforzo > 90) testo.setAttribute('color', 'red');
        else testo.setAttribute('color', 'yellow');
      }, 50);
    </script>
  </body>
</html>
